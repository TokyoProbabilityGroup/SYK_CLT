name: Lean Action CI

# Checks both Lake packages on pushes to main and deploys Blueprint/_out/site/html-multi to GitHub Pages.
# Markdown-only changes do not trigger this workflow; run it manually on main to redeploy.
# A manual run on another branch checks the packages without deploying.
# Pages setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
# The github-pages environment must allow deployments from main.

on:
  push:
    branches:
      - 'main'
    paths:
      - '**.lean'
      - '**/lakefile.toml'
      - '**/lake-manifest.json'
      - '**/lean-toolchain'
      - '.github/workflows/lean_action_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# Concurrency is set per job: a newer run cancels older checks, but never a running deployment.

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-lean-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      - uses: leanprover/lean-action@v1
        with:
          build-args: SYK
          use-mathlib-cache: true
          use-github-cache: false

  blueprint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-blueprint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      - uses: leanprover/lean-action@v1
        # Jobs do not share build outputs, so this also rebuilds the mathematical library.
        with:
          lake-package-directory: Blueprint
          build-args: SYKBlueprint
          use-mathlib-cache: true
          use-github-cache: false

      - name: Build Blueprint site
        working-directory: Blueprint
        run: lake exe vbp build

      - name: Check Blueprint output
        working-directory: Blueprint
        run: lake exe vbp check --site _out/site

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: Blueprint/_out/site/html-multi

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [lean, blueprint]
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
