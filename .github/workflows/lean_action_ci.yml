name: Lean Action CI

on:
  push:
    branches:
      - 'main'
    paths:
      - '**.lean'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v5
        with:
          path: SYK

      - name: Materialize workspace root
        run: |
          set -euo pipefail
          cp SYK/workspace/lakefile.toml      ./lakefile.toml
          cp SYK/workspace/lake-manifest.json ./lake-manifest.json
          cp SYK/workspace/lean-toolchain     ./lean-toolchain
          ls -la

      - uses: leanprover/lean-action@v1
        # The parent workspace has no default targets; build the Blueprint package,
        # which also checks the complete mathematical library.
        with:
          build-args: SYKBlueprint
          use-github-cache: false

      - name: Build Blueprint site
        run: lake lean SYK/Blueprint/SYKBlueprintMain.lean -- --run SYK/Blueprint/SYKBlueprintMain.lean --output SYK/_out/site

      - name: Check Blueprint output
        run: lake exe vbp check --site SYK/_out/site
