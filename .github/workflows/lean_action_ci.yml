name: Lean Action CI

on:
  push:
    branches:
      - 'main'
    paths:
      - '**.lean'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v5
        with:
          path: SYK

      - name: Materialize workspace root
        run: |
          set -euo pipefail
          cp SYK/workspace/lakefile.toml      ./lakefile.toml
          cp SYK/workspace/lake-manifest.json ./lake-manifest.json
          cp SYK/workspace/lean-toolchain     ./lean-toolchain
          ls -la

      - uses: leanprover/lean-action@v1
        # Use defaultTargets from the version-controlled Lake configuration.
        with:
          use-github-cache: false

      # Verso is temporarily disabled to reduce CI work. Preserve for restoration.
      # - name: Build Blueprint site
      #   run: lake lean SYK/BlueprintMain.lean -- --run SYK/BlueprintMain.lean --output SYK/_out/site
      #
      # - name: Check Blueprint output
      #   run: lake exe vbp check --site SYK/_out/site
