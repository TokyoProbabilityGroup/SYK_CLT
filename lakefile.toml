name = "SYK"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["SYK"]
# Share the parent workspace's dependency checkouts when this package is opened as the
# project root (for example by an editor); a parent workspace ignores this setting.
packagesDir = "../.lake/packages"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

[[lean_lib]]
name = "SYK"
globs = ["SYK.+"]
