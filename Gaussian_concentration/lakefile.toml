name = "RequestProject"
defaultTargets = ["GaussianConcentrationAux", "GaussianCovSmooth", "GaussianCovMollify", "gaussian_concentration"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "GaussianConcentrationAux"
globs = ["GaussianConcentrationAux"]

[[lean_lib]]
name = "GaussianCovSmooth"
globs = ["GaussianCovSmooth"]

[[lean_lib]]
name = "GaussianCovMollify"
globs = ["GaussianCovMollify"]

[[lean_lib]]
name = "gaussian_concentration"
globs = ["gaussian_concentration"]
